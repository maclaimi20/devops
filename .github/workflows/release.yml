
name: Automate Application Releases

# Trigger the workflow when a version tag is pushed
on:
  push:
    tags:
      - 'v*.*.*'

# Permissions required to create a GitHub Release
permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Validate application files
      - name: Validate application
        run: |
          test -f index.html
          test -f hello.html
          echo "Application files validated successfully"

      # Step 3: Create a release package
      - name: Package application
        run: |
          mkdir release-package
          cp index.html hello.html release-package/
          cp Dockerfile release-package/ 2>/dev/null || true
          tar -czf devops-app.tar.gz release-package

      # Step 4: Publish GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: devops-app.tar.gz
